<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarea 2 – nav_bar.png</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #0f172a;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    /* Barra de navegación */
    nav {
      background: linear-gradient(90deg, #1e293b, #334155);
      width: 100%;
      padding: 20px 0;
      display: flex;
      justify-content: center;
      gap: 50px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    nav a {
      text-decoration: none;
      color: #e2e8f0;
      font-size: 1.2rem;
      transition: all 0.3s ease;
    }

    nav a:hover {
      font-weight: bold;
      text-decoration: underline;
      color: #fff;
    }

    h1 {
      margin-top: 60px;
      color: #cbd5e1;
      text-align: center;
      font-size: 1.6rem;
    }
  </style>
</head>
<body>

  <nav>
    <a href="#acerca">Acerca de</a>
    <a href="#detalles">Detalles del proyecto</a>
    <a href="#habilidades">Habilidades</a>
    <a href="#recomendaciones">Recomendaciones</a>
  </nav>

  <h1>Barra de Navegación – Tarea 2</h1>

</body>
</html>
